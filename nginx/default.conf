server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/wasm image/svg+xml;

    # Service Worker — nunca cachear
    location = /ngsw-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        try_files $uri =404;
    }
    location = /ngsw.json {
        add_header Cache-Control "no-store, no-cache";
        expires off;
        try_files $uri =404;
    }

    # PWA manifest
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Assets con hash (Angular) — cachear para siempre
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket (Spring Boot)
    location /api/ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_cache_bypass  $http_upgrade;
    }

    # TF: modelos offline (GET directo al servicio tf, sin pasar por Spring Boot)
    location /api/workflow-ai/models/ {
        proxy_pass         http://tf:8001/models/;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # TF: archivos estáticos model.json y weights (TensorFlow.js)
    location /api/workflow-ai/static/ {
        proxy_pass         http://tf:8001/static/;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # API → Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;
        client_max_body_size 50m;
    }

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
